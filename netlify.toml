[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."refresh-instagram-tokens"]
  schedule = "0 3 * * *"

[functions."metrics-scheduled"]
  schedule = "0 * * * *"

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200
[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200
[[redirects]]
