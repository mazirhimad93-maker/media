name: Deploy Social Hub Preview

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/social-hub-bootstrap-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: social-hub-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Social Hub preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
