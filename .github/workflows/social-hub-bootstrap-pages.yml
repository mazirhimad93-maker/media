name: Expand Social Hub and Deploy Preview

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - ".github/workflows/social-hub-bootstrap-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: social-hub-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      expanded: ${{ steps.expand.outputs.expanded }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct and expand Social Hub
        id: expand
        shell: bash
        run: |
          set -euo pipefail
          if [ -f bootstrap/chunk0.b64 ]; then
            cat bootstrap/chunk0.b64 bootstrap/chunk1.b64 bootstrap/chunk2.b64 bootstrap/chunk3.b64 > /tmp/socialhub.b64
            base64 -d /tmp/socialhub.b64 > /tmp/socialhub.zip
            rm -rf /tmp/socialhub
            mkdir -p /tmp/socialhub
            unzip -q /tmp/socialhub.zip -d /tmp/socialhub
            test -f /tmp/socialhub/alchemic-social-hub/public/index.html
            rsync -a --exclude='.git' --exclude='.github' /tmp/socialhub/alchemic-social-hub/ ./
            rm -rf bootstrap .gitkeep
            echo "expanded=true" >> "$GITHUB_OUTPUT"
          else
            echo "expanded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit expanded application
        if: steps.expand.outputs.expanded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Expand Alchemic Social Hub package [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Social Hub preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
